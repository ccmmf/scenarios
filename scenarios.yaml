# Scenario configs for CCMMF management practice simulations
#
# Sources:
#   - NRCS CPS 329: Residue and Tillage Management, No Till (Sept 2016)
#   - NRCS CPS 340: Cover Crop (May 2024)
#   - NRCS CPS 449: Irrigation Water Management (Oct 2024)
#   - CDFA Healthy Soils Program: Compost Application Rates (Gravuer 2016)
#   - UC ANR Publications: Various crop-specific guidelines
#
# STIR scale note:
#   The NRCS Soil tillage intensity rating (STIR) uses a 0-200 scale.
#   - No-Till: STIR <= 20 (CPS 329)
#   - Reduced Till: STIR 20-60 (CPS 345)
#   - Conventional Till: STIR > 80
#
#   Our parameter `tillage_eff_0to1` represents the fraction of SOM transferred
#   from slow to fast decomposition pools. Conversion: tillage_eff ~ STIR / 200
#   This is a model-specific parameter, NOT direct STIR.

site_id: herb_site_1
start_year: 2016
end_year: 2024
pecan_events_version: "0.1.0"

# BASELINE
# Represents conventional annual row crop management in San Joaquin Valley
baseline:
  events:
    # ── Tillage ──
    # Conventional tillage with full inversion
    # Conversion: 70/200 = 0.35 (mid-range conventional, STIR ~70)
    - event_type: tillage
      name: tillage_spring
      date: "03-20"
      tillage_eff_0to1: 0.35 # NRCS CPS 329, STIR ~70
      
    # ── Fertilization ──
    # Synthetic N fertilizer for annual row crops
    # Rate: 180-200 kg N/ha typical for processing tomato
    - event_type: fertilization
      name: fertilization_spring
      date: "03-25"
      nh4_n_kg_m2: 0.020 # 200 kg N/ha, UC Davis cost study
      
    # ── Planting ──
    # Processing tomato transplanting
    - event_type: planting
      name: planting_spring
      date: "04-10"
      # leaf_c_kg_m2: Initial leaf carbon at transplant
      # Typical 6-week transplant: ~30-40 g dry matter, ~45% C
      leaf_c_kg_m2: 0.0034
      
    # ── Irrigation ──
    # Surface/sprinkler irrigation for annual crops
    # Seasonal total: 550mm typical for tomatoes in SJV
    # 6 events × 90mm = 540mm seasonal
    - event_type: irrigation
      name: irrigation_growing
      date: ["05-15", "06-15", "07-15", "08-15", "09-01", "09-15"]
      # amount_mm: 90mm per event (high-frequency furrow/sprinkler)
      amount_mm: 90
      # method: "canopy" = overhead sprinkler; "soil" = drip/surface
      method: canopy
      
    # ── Harvest ──
    # Mechanical harvest - tomatoes for processing
    - event_type: harvest
      name: harvest_fall
      date: "10-10"
      # frac_above_removed_0to1: Fraction of aboveground biomass removed
      # Processing tomato: fruit + some vine material removed
      # typical harvest index 0.5-0.6
      frac_above_removed_0to1: 0.5
      frac_below_removed_0to1: 0.0

# MANAGEMENT PRACTICE SCENARIOS
# Each scenario modifies baseline events per CDFA Healthy soils practices
scenarios:
  baseline: {}
  
  # Compost scenario - CDFA HSP rates
  compost:
    events:
      - event_type: fertilization
        name: fertilization_spring
        # Application timing: Pre-plant, before tillage incorporation
        date: "02-20"
        # CDFA Gravuer 2016 Table 2: annual crops, lower N compost (C:N>11)
        # 6-8 moist tons/ac = 4.0-5.3 dry tons/ac
        # midpoint 4.7 dry tons/ac @ 35% C = 0.37 kg C/m2
        # using 0.45 to be safely within CDFA range
        org_c_kg_m2: 0.45
        org_n_kg_m2: 0.028 # C:N=16
        # Remove synthetic N when using compost (null = remove from event)
        nh4_n_kg_m2: null

  # Reduced tillage - NRCS CPS 345 compliant
  # STIR value > 20 and <= 60; maintains >30% surface residue
  reduced_till:
    events:
      - event_type: tillage
        name: tillage_spring
        tillage_eff_0to1: 0.10 # STIR ~20 (threshold for reduced till)
  
  # No-till - NRCS CPS 329 compliant
  # STIR <= 20; no full-width soil disturbance
  zero_till:
    events:
      - event_type: tillage
        name: tillage_spring
        tillage_eff_0to1: 0.0 # STIR <= 20
  
  # Drip irrigation
  reduced_irrig_drip:
    events:
      - event_type: irrigation
        name: irrigation_growing
        # High-frequency drip irrigation schedule
        # Season: May 1 - Aug 28 (120 days, 40 events every 3 days)
        #
        # Drip systems typically achieve 85-95% application efficiency
        # vs 60-75% for sprinkler
        date:
          start: "05-01"
          # every_days: Drip typically 2-4 day intervals
          every_days: 3
          # n_events: 40 events × 8mm = 320mm seasonal
          # This is ~40% reduction vs baseline 540mm (efficiency gain)
          n_events: 40
        amount_mm: 8  # 320mm total, ~40% less than sprinkler
        # method: "soil" indicates sub-canopy/drip appln
        method: soil

  # Stacked practices
  # Combines: Compost + Reduced till + Drip irrigation
  stacked:
    events:
      # Compost (same as compost scenario)
      - event_type: fertilization
        name: fertilization_spring
        date: "02-20"
        org_c_kg_m2: 0.45     # CDFA Table 2: 4.7 tons/ac dry @ 35% C
        org_n_kg_m2: 0.028    # C:N = 16 (finished compost)
        nh4_n_kg_m2: null
      # Reduced tillage (same as reduced_till scenario)
      - event_type: tillage
        name: tillage_spring
        tillage_eff_0to1: 0.10
      # Drip irrigation (same as reduced_irrig_drip scenario)
      - event_type: irrigation
        name: irrigation_growing
        date:
          start: "05-01"
          every_days: 3
          n_events: 40
        amount_mm: 8
        method: soil
